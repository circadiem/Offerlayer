name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  postgres:
    name: Migrations and tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerlayer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate twice (must be idempotent)
        env:
          DATABASE_URL: ${{ env.PGURL }}/offerlayer
        run: pnpm db:migrate && pnpm db:migrate
      - name: Create test database
        run: psql "$PGURL/offerlayer" -c "CREATE DATABASE offerlayer_test"
      - name: Test suite against Postgres
        env:
          TEST_DATABASE_URL: ${{ env.PGURL }}/offerlayer_test
        run: pnpm test

  prod-boot:
    name: Production build boots with demo routes unreachable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerlayer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/offerlayer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (also applies migrations)
        run: pnpm build
      - name: Generate throwaway production secrets
        run: |
          for k in TOKEN_SIGNING_SECRET ACCESS_TOKEN_ENCRYPTION_KEY PRINCIPAL_HASH_SECRET \
                   INTERNAL_API_KEY SHOPPER_AGENT_KEY SELLER_AGENT_KEY SHOPIFY_API_SECRET; do
            echo "$k=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done
          echo "SHOPIFY_API_KEY=ci-shopify-key" >> "$GITHUB_ENV"
      - name: Start the built server in production mode
        run: |
          # OFFERLAYER_DEMO is deliberately unset.
          nohup pnpm preview > preview.log 2>&1 &
      - name: Boot check
        env:
          BASE_URL: http://127.0.0.1:8081
        run: pnpm check:prod-boot
      - name: Server log
        if: always()
        run: cat preview.log || true
